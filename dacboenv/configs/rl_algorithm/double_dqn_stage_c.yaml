# @package _global_

# Stage-C Double-DQN defaults for the 32-worker mixed BBOB/YAHPO experiment.
# One vector step contributes 32 transitions. Eight gradient steps therefore
# give an update/transition ratio of 0.25.
defaults:
  - double_dqn
  - _self_

rl_algorithm:
  policy_kwargs:
    net_arch: [128, 128]
  hyperparameters:
    policy: MultiInputPolicy
    verbose: 1
    learning_rate: 1.0e-4
    buffer_size: 262144
    learning_starts: 10240
    batch_size: 512
    tau: 1.0
    gamma: 1.0
    train_freq: [1, step]
    gradient_steps: 8
    target_update_interval: 10240
    exploration_fraction: 0.30
    exploration_initial_eps: 1.0
    exploration_final_eps: 0.05
    max_grad_norm: 10.0
    optimize_memory_usage: false
    n_steps: 1
    replay_buffer_kwargs: {}

optimizer_id: DoubleDQN-WEI-StageC

experiment:
  save_replay_buffer:
    final: true
    periodic: false
