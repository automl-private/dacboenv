hydra:
  run:
    dir: ${outdir}
  sweep:
    dir: ${baserundir}
    subdir: ${optimizer_id}/${benchmark_id}/${task_id}/${seed}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - +instances=bbob2d_8_3seeds
    - +task=dacboenv_sawei_symlog_skip
    - +opt/ppo=mlp
    - +env/refperf=saweip
    - experiment.n_workers=16
    - experiment.n_episodes=1000
    - seed=1
    - +env/instance_selector=roundrobin
    - baserundir=runsicml2
  job:
    name: ppo
    chdir: null
    override_dirname: +env/instance_selector=roundrobin,+env/refperf=saweip,+instances=bbob2d_8_3seeds,+opt/ppo=mlp,+task=dacboenv_sawei_symlog_skip,baserundir=runsicml2,experiment.n_episodes=1000,experiment.n_workers=16,seed=1
    id: ???
    num: ???
    config_name: null
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /scratch/hpc-prf-intexml/cbenjamins/repos/dacboenv
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /scratch/hpc-prf-intexml/cbenjamins/repos/dacboenv/dacboenv/configs
      schema: file
      provider: main
    - path: hydra_plugins.hydra_colorlog.conf
      schema: pkg
      provider: hydra-colorlog
    - path: ''
      schema: structured
      provider: schema
    output_dir: /scratch/hpc-prf-intexml/cbenjamins/repos/dacboenv/runsicml2/PPO-MLP/DACBO/dacbo_Csymlogregret_AWEI-skip_Ssawei_Rsymlogregret-SAWEI-P_Ibbob2d_fid8_3seeds/1
    choices:
      env/instance_selector: roundrobin
      env/refperf: saweip
      opt/ppo: mlp
      task: dacboenv_sawei_symlog_skip
      task/../env/reward@...env.reward: symlogregret
      task/../env/obs@...env.obs: sawei
      task/../env/action@...env.action: wei_alpha_skip
      task/../env/opt@...env.opt: base
      task/../env@...env: base
      task/objfun@objfun: alpharulenet
      instances: bbob2d_8_3seeds
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
