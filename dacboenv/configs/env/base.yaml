# @package _global_

dacboenv:
  _target_: dacboenv.dacboenv.DACBOEnv
  task_ids: ???
  inner_seeds: ???
  observation_keys: ???
  # GP hyperparameter observations are opt-in through env/obs variants. These
  # settings do not alter global_state or action_features.
  gp_hyperparameters:
    enabled: false
    max_raw_parameters: 64
    overflow_policy: error
    near_bound_fraction: 0.05
    unsupported_model_policy: zeros
    strict_kernel_validation: false
  action_space_class: ???
  action_space_kwargs: ???
  reward_keys: ???
  seed: ${seed}
  interaction_frequency: 1
  # YAHPO-only future training may explicitly override this with 0.6 or 0.8.
  # Validation and test factories force the native 1.0 budget.
  yahpo_training_budget_multiplier: 1.0
  context_split: train
  reference_performance_fn: reference_performance/reference_performance.parquet
  reference_performance_optimizer_id: SMAC3-BlackBoxFacade
  terminate_after_reference_performance_reached: False
  instance_selector_class:
    _target_: dacboenv.env.instance.RoundRobinInstanceSelector
    _partial_: true
