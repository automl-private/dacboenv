# @package _global_
defaults:
  - structured_ppo_f1
  - override /instance_sets@training_instances: yahpo_train
  - override /instance_sets@validation_instances: yahpo_validation
  - override /instance_sets@test_instances: yahpo_test_official_so
  - _self_

# Intentionally fails at manifest validation until the pinned YAHPO data and
# fully keyed non-test reference table described by the manifest are present.
experiment:
  n_workers: 4
  total_timesteps: 16
  checkpoint_freq: 8
  progress_bar: false
  final_evaluation:
    enabled: false
  validation:
    enabled: false
optimizer:
  n_steps: 2
  batch_size: 8
  n_epochs: 1
baserundir: runs_pilot_yahpo
