# @package _global_

optimizer:
  policy_class:
    _target_: dacboenv.policy.sb3_model.ModelPolicy
    _partial_: true
  policy_kwargs:
    model: runs_v1/runs_v12/PPO-MLP/DACBO/dacbo_Csymlogregret_AWEI-skip_Ssawei_Rsymlogregret-SAWEI-P_Ibbob2d_fid8_3seeds/5/rl_model_160160_steps
    model_class: stable_baselines3.PPO
policy_id: PPO-MLP--dacbo_Csymlogregret_AWEI-skip_Ssawei_Rsymlogregret-SAWEI-P_Ibbob2d_fid8_3seeds--seed5
optimizer_id: PPO-MLP--dacbo_Csymlogregret_AWEI-skip_Ssawei_Rsymlogregret-SAWEI-P_Ibbob2d_fid8_3seeds--seed5
dacboenv:
  task_ids:
  - ${task.name}
  inner_seeds:
  - ${seed}
  _target_: dacboenv.dacboenv.DACBOEnv
  observation_keys:
  - ubr_smoothed_gradient
  - acq_value_PI
  - acq_value_WEI_explore
  - previous_param
  action_space_class:
    _target_: dacboenv.env.action.WEITempoRLActionSpace
    _partial_: true
  action_space_kwargs:
    step_durations:
    - 1
    - 5
    - 10
    param_levels:
    - 0.0
    - 0.25
    - 0.5
    - 0.75
    - 1
  reward_keys:
  - symlogregret
  seed: ${seed}
  reference_performance_fn: resultssawei/reference_performance.parquet
  reference_performance_optimizer_id: SAWEI-P
  terminate_after_reference_performance_reached: false
  instance_selector_class:
    _target_: dacboenv.env.instance.RoundRobinInstanceSelector
    _partial_: true
    offset: 0
  optimizer_cfg:
    smac_cfg:
      smac_class: smac.facade.blackbox_facade.BlackBoxFacade
      scenario:
        seed: ${seed}
        n_trials: ${task.optimization_resources.n_trials}
        deterministic: true
        n_workers: 1
        output_directory: ${outdir}/smac3_output
      smac_kwargs:
        logging_level:
          _target_: pathlib.Path
          _args_:
          - dacboenv/configs/logging/smac_internal.yaml
        dask_client: null
        overwrite: true
        initial_design:
          _target_: ${dacboenv.optimizer_cfg.smac_cfg.smac_class}.get_initial_design
          _partial_: true
          n_configs: null
          max_ratio: 0.2
        random_design:
          _target_: ${dacboenv.optimizer_cfg.smac_cfg.smac_class}.get_random_design
          scenario: ${dacboenv.optimizer_cfg.smac_cfg.scenario}
          probability: 0.0
        acquisition_function:
          _target_: dacboenv.utils.weighted_expected_improvement.WEI
  evaluation_mode: true
